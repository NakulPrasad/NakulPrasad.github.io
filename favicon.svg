<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Newsprint Paper Canvas Background -->
  <rect width="64" height="64" rx="12" fill="#1c1917"/>
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#faf7f2" stroke="#1c1917" stroke-width="1.5"/>
  <!-- Ornate Double Border & Rules -->
  <line x1="8" y1="12" x2="56" y2="12" stroke="#1c1917" stroke-width="1.5"/>
  <line x1="8" y1="14" x2="56" y2="14" stroke="#1c1917" stroke-width="0.5"/>
  <!-- Monogram NP with Serif Typography -->
  <text x="32" y="38" font-family="Georgia, 'Playfair Display', serif" font-size="22" font-weight="900" fill="#1c1917" text-anchor="middle" letter-spacing="1">NP</text>
  <!-- Tiny Subtitle / Star -->
  <circle cx="24" cy="46" r="1.5" fill="#991b1b"/>
  <text x="32" y="48" font-family="'Courier New', monospace" font-size="7" font-weight="bold" fill="#1b4332" text-anchor="middle" letter-spacing="0.5">DEV</text>
  <circle cx="40" cy="46" r="1.5" fill="#991b1b"/>
  <line x1="12" y1="52" x2="52" y2="52" stroke="#1c1917" stroke-width="1"/>
</svg>
